services:
  db:
    image: postgres:16
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${DB_NAME:-web_crawler}
      POSTGRES_USER: ${DB_USER:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-myuser} -d ${DB_NAME:-web_crawler}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local backend API. The CLI remains available via
  # `docker compose exec backend python -m src.cli ...`.
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
        required: false
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # In production, frontend runs on Vercel against Neon. This service is for
  # iterating on the Next.js app locally with hot reload.
  frontend:
    build: ./frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
