name: crawl

# Cron + manual dispatch (the latter is invoked from the Vercel UI's
# "Crawl now" button via Server Action). One workflow file serves both
# triggers so behaviour is identical and runs are auditable in one place.
on:
  schedule:
    - cron: "0 */6 * * *"  # 06:00, 12:00, 18:00, 00:00 UTC
  workflow_dispatch:
    inputs:
      target_id:
        description: "Specific crawl target UUID (omit for all active targets)"
        required: false
        type: string

# Prevent overlapping runs against the same DB. cancel-in-progress=false so a
# manual run does not abort an in-flight scheduled run mid-way.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      # Playwright Chromium is ~150 MB — cache it across runs.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_REQUIRE_SSL: "true"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          PYTHONPATH: ${{ github.workspace }}/backend
          TARGET_ID: ${{ inputs.target_id }}
        run: |
          if [ -n "$TARGET_ID" ]; then
            echo "Crawling single target: $TARGET_ID"
            python -m src.cli crawl-target "$TARGET_ID"
          else
            echo "Crawling all active targets"
            python -m src.cli crawl
          fi
